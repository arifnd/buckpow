repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: sync-version
        name: Sync pyproject version from src/version.py
        entry: python scripts/sync_version.py
        language: python
        pass_filenames: false
