{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-sm min-w-0">
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg shadow-xl p-6">
      <h2 class="text-xl font-semibold text-center mb-2">Sign in to {{ brand_name }}</h2>
      <div id="login-error" class="text-sm text-red-500 text-center mb-4 hidden"></div>
      <form id="login-form" hx-boost="false" novalidate class="space-y-4">
        <div>
          <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1" for="email">Email</label>
          <input type="email" name="email" id="email" autocomplete="email"
                 class="w-full px-3 py-1.5 rounded text-sm bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-300 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400">
          <div id="email-error" class="text-xs text-red-500 mt-1 hidden"></div>
        </div>
        <div>
          <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1" for="password">Password</label>
          <div class="relative">
            <input type="password" name="password" id="password" autocomplete="current-password"
                   class="w-full px-3 py-1.5 pr-9 rounded text-sm bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-300 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400">
            <button type="button" id="password-toggle" tabindex="-1"
                    class="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-300 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-5 h-5 flex-shrink-0">
  <path id="password-eye" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path>
</svg>
            </button>
          </div>
          <div id="password-error" class="text-xs text-red-500 mt-1 hidden"></div>
        </div>
        <input type="hidden" id="next" value="">
        <button type="submit" class="w-full px-4 py-1.5 rounded text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 transition-colors">
          Sign In
        </button>
      </form>
    </div>
  </div>
{% endblock %}

{% block extra_scripts %}
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  document.getElementById('next').value = params.get('next') || '/';

  document.getElementById('password-toggle').addEventListener('click', function() {
    var inp = document.getElementById('password');
    var path = document.getElementById('password-eye');
    var EYE = 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z';
    var EYE_OFF = 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z';
    if (inp.type === 'password') {
      inp.type = 'text';
      path.setAttribute('d', EYE_OFF);
    } else {
      inp.type = 'password';
      path.setAttribute('d', EYE);
    }
  });

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var errorEl = document.getElementById('login-error');
    var emailError = document.getElementById('email-error');
    var passwordError = document.getElementById('password-error');
    errorEl.classList.add('hidden');
    emailError.classList.add('hidden');
    passwordError.classList.add('hidden');

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email) {
      emailError.textContent = 'Email is required';
      emailError.classList.remove('hidden');
      return;
    }
    if (!password) {
      passwordError.textContent = 'Password is required';
      passwordError.classList.remove('hidden');
      return;
    }

    try {
      var res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: email,
          password: password,
        }),
      });
      if (res.ok) {
        window.location.href = document.getElementById('next').value;
      } else {
        var data = await res.json();
        errorEl.textContent = data.error || 'Login failed';
        errorEl.classList.remove('hidden');
      }
    } catch (err) {
      errorEl.textContent = 'Network error';
      errorEl.classList.remove('hidden');
    }
  });
})();
</script>
{% endblock %}
