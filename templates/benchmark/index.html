{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6" hx-boost="false">
  <h1 class="text-xl font-bold mb-4">Benchmark Comparison</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
    <div class="min-w-0">
      <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1" for="session-a">Session 1</label>
      <select id="session-a" class="w-full px-3 py-1.5 rounded text-sm bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-300 focus:outline-none focus:border-blue-400">
        <option value="">Select a finished session</option>
      </select>
    </div>
    <div class="min-w-0">
      <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1" for="session-b">Session 2</label>
      <select id="session-b" class="w-full px-3 py-1.5 rounded text-sm bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-300 focus:outline-none focus:border-blue-400">
        <option value="">Select a finished session</option>
      </select>
    </div>
    <div class="min-w-0">
      <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1" for="session-c">Session 3 <span class="text-gray-400 dark:text-gray-500">(optional)</span></label>
      <select id="session-c" class="w-full px-3 py-1.5 rounded text-sm bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-300 focus:outline-none focus:border-blue-400">
        <option value="">Select (optional)</option>
      </select>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2 mb-6">
    <button id="compare-btn" class="px-4 py-1.5 rounded text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>Compare</button>
    <span id="compare-status" class="text-sm text-gray-500 dark:text-gray-400"></span>
  </div>

  <div id="results-section" class="hidden">
    <div class="mb-6">
      <div class="overflow-x-auto">
        <table class="w-full border-collapse">
          <thead class="bg-gray-50 text-left text-xs uppercase tracking-wide text-gray-500 dark:bg-gray-800/50 dark:text-gray-400">
            <tr>
              <th class="px-3 py-3">Metric</th>
              <th class="text-left py-2 px-3 font-medium" id="header-a">Session 1</th>
              <th class="text-left py-2 px-3 font-medium" id="header-b">Session 2</th>
              <th class="text-left py-2 px-3 font-medium" id="header-c">Session 3</th>
              </tr>
          </thead>
          <tbody id="comparison-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg p-4">
      <div class="flex items-center gap-2 mb-3">
        <h6 class="text-base text-gray-500 dark:text-gray-400 font-medium">Power Overlay</h6>
      </div>
      <div class="relative h-[300px]">
        <canvas id="benchmarkChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/benchmark.js') }}"></script>
{% endblock %}
