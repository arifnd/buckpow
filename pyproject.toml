[project]
name = "buckpow"
version = "0.1.0-beta.3"
description = "Energy observability and benchmarking platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0,<0.140.0",
    "uvicorn[standard]>=0.30.0,<1",
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13.0,<1.14",
    "python-dotenv>=1.0.0,<2",
    "pyjwt>=2.8.0,<3",
    "bcrypt>=4.0.1,<4.2",
    "python-multipart>=0.0.12,<1",
    "jinja2>=3.1.0,<4",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<6",
    "httpx>=0.27.0,<1",
    "ruff>=0.6.0,<1",
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.0,<10",
]

[tool.ruff]
src = ["src", "scripts"]
exclude = ["migrations"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
pythonpath = ["."]

[tool.pytest_env]
DATABASE_URL = "sqlite://"
BCRYPT_ROUNDS = "4"

[tool.fastapi]
entrypoint = "src:app"
